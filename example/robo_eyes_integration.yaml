# Full corrected lambda for the routing block (copy-paste ready):

script:
  - id: draw_display
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *target = nullptr;
          bool va_mode_active = false;

          if (id(init_in_progress)) {
            target = id(initializing_page)->obj;

          } else if (!wifi::global_wifi_component->is_connected()) {
            target = id(no_wifi_page)->obj;

          } else if (!api::global_api_server->is_connected()) {
            target = id(no_ha_page)->obj;

          } else if (id(current_mode) == 1) {
            // ── Intercom mode (unchanged) ──────────────────────────────
            auto s = id(intercom).get_state_str();
            if      (s == "Ringing"  || s == "Incoming")  target = id(ic_ringing_in_page)->obj;
            else if (s == "Calling"  || s == "Outgoing")  target = id(ic_ringing_out_page)->obj;
            else if (s == "Streaming"|| s == "Answering") target = id(ic_in_call_page)->obj;
            else                                          target = id(ic_idle_page)->obj;

          } else {
            // ── VA mode — hand off to robo_eyes ───────────────────────
            va_mode_active = true;
            int phase = id(voice_assistant_phase);
            id(robo_eyes_component).set_phase(phase);
            id(robo_eyes_component).show();
          }

          // Non-VA: load LVGL page if it changed
          if (!va_mode_active && target != nullptr) {
            bool page_changed = (target != lv_disp_get_scr_act(nullptr));
            if (page_changed) {
              lv_anim_del(id(idle_anim), nullptr);
              lv_disp_load_scr(target);
              lv_obj_invalidate(lv_disp_get_scr_act(nullptr));
            }
          }

      # ── Post-routing steps (keep exactly as in your original) ─────────────

      # Update IC idle labels when in intercom mode
      - if:
          condition:
            lambda: |-
              return id(current_mode) == 1
                     && id(intercom).get_state_str() == "Idle"
                     && !id(init_in_progress);
          then:
            - script.execute: update_ic_idle_labels

      # Self-heal: ensure MWW is active in VA idle
      - if:
          condition:
            and:
              - lambda: |-
                  return id(current_mode) == 0
                         && id(voice_assistant_phase) == ${voice_assist_idle_phase_id}
                         && !id(init_in_progress);
              - switch.is_off: mute
              - not:
                  media_player.is_announcing:
          then:
            - if:
                condition:
                  not:
                    micro_wake_word.is_running:
                then:
                  - micro_wake_word.start

      # Always sync timer overlay
      - script.execute: update_timer_state


