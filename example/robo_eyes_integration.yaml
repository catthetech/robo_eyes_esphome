# robo_eyes_integration.yaml
# =============================================================================
# Step-by-step guide to integrate robo_eyes into your existing YAML.
# This file contains only the ADDITIONS and REPLACEMENTS needed.
# Your existing config remains otherwise unchanged.
#
# Checklist:
#   [1] Add robo_eyes to external_components
#   [2] Add the robo_eyes: config block
#   [3] Replace the VA-mode section in draw_display
#   [4] (Optional) instant mood sync in ui_state_changed
# =============================================================================


# ═════════════════════════════════════════════════════════════════════════════
# [1]  external_components — ADD robo_eyes alongside your existing entry
# ═════════════════════════════════════════════════════════════════════════════
# Find your existing external_components block and add the robo_eyes source.
# Keep the intercom/i2s_audio_duplex/esp_aec entry exactly as-is.

external_components:

  # ── NEW: robo_eyes ────────────────────────────────────────────────────────
  - source:
      type: git
      url: https://github.com/YOUR_GITHUB_USERNAME/robo_eyes_esphome   # <── update
      ref: main
    components: [robo_eyes]

  # ── EXISTING (keep unchanged) ─────────────────────────────────────────────
  - source:
      type: git
      url: https://github.com/n-IA-hane/esphome-intercom
      ref: main
    components: [intercom_api, i2s_audio_duplex, esp_aec]


# ═════════════════════════════════════════════════════════════════════════════
# [2]  robo_eyes: config block
#      Add this as a new top-level key (same level as lvgl:, script:, etc.)
# ═════════════════════════════════════════════════════════════════════════════

robo_eyes:
  id: robo_eyes_component

  # ── Appearance ─────────────────────────────────────────────────────────────
  eye_color:     0x0099FF   # hex RGB — eye fill colour
  bg_color:      0x000000   # background (must match your display bg_color)
  eye_width:     62
  eye_height:    46
  border_radius: 16         # 0 = sharp square corners, ~23+ = oval
  eye_gap:       28         # horizontal gap between the two eyes
  space_between: 0          # extra spread (negative = closer together)
  pupil_size:    10         # radius in px — set to 0 to disable pupils
  show_pupils:   true       # false = pupils never drawn regardless of size
  cyclops:       false      # true = single centred eye

  # ── Animation ──────────────────────────────────────────────────────────────
  blink_interval:  4s       # average time between blinks
  blink_variation: 2s       # ± random variation added per blink
  wander_interval: 5s       # average time between wander target changes
  fps:             25       # canvas redraw rate (5–60 fps)

  # ── Display geometry ────────────────────────────────────────────────────────
  display_width:  240
  display_height: 240

  # ── Voice assistant phase IDs ───────────────────────────────────────────────
  # These already match your substitutions — only change if you customised them.
  phase_idle_id:            1
  phase_listening_id:       2
  phase_thinking_id:        3
  phase_replying_id:        4
  phase_not_ready_id:      10
  phase_error_id:          11
  phase_muted_id:          12
  phase_timer_finished_id: 20


