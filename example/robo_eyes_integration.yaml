# ═════════════════════════════════════════════════════════════════════════════
# MOOD → PHASE MAPPING  (for reference)
# ═════════════════════════════════════════════════════════════════════════════
#
#  phase_id  |  VA state          |  Mood      |  Eyes behaviour
#  ----------+--------------------+------------+--------------------------------
#  1         |  idle              |  DEFAULT   |  slow wander, autoblink
#  2         |  listening         |  CURIOUS   |  taller, fast restless wander
#  3         |  thinking          |  TIRED     |  droopy outer corner, look ↖
#  4         |  replying          |  HAPPY     |  smile cut, bounce, fast blink
#  10        |  not_ready         |  TIRED     |  same as thinking
#  11        |  error             |  ANGRY     |  inner corner, no blink, jitter
#  12        |  muted             |  CLOSED    |  eyes gradually close
#  20        |  timer_finished    |  CONFUSED  |  fast jitter + shake
