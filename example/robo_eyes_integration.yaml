#            id(robo_eyes_component).set_phase(phase);
#            id(robo_eyes_component).show();
#            // Skip the page-changed / lv_disp_load_scr block below
#            // by returning early. The post-routing steps (MWW self-heal,
#            // timer overlay, IC idle labels) are handled in the steps
#            // that follow the lambda in your draw_display script.
#            return;
